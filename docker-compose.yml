version: '3.8'

services:
  # 1. ZENOVA Main Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zenova-api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - ZENOVA_ENV=${ZENOVA_ENV:-development}
      - ZENOVA_LOG_LEVEL=${ZENOVA_LOG_LEVEL:-INFO}
      - ZENOVA_SECRET_KEY=${ZENOVA_SECRET_KEY:-zenova-dev-secret-key-do-not-use-in-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://zenova:zenova_pass@postgres:5432/zenova_db}
      - DATABASE_URL_SYNC=${DATABASE_URL_SYNC:-postgresql://zenova:zenova_pass@postgres:5432/zenova_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - zenova_data:/app/data
      - zenova_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 2. PostgreSQL Relational Database
  postgres:
    image: postgres:15-alpine
    container_name: zenova-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=zenova
      - POSTGRES_PASSWORD=zenova_pass
      - POSTGRES_DB=zenova_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenova -d zenova_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Redis In-Memory Cache & Token Bucket
  redis:
    image: redis:7-alpine
    container_name: zenova-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Prometheus Metrics Scraper
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: zenova-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api

volumes:
  zenova_data:
  zenova_logs:
  postgres_data:
  redis_data:
  prometheus_data:
